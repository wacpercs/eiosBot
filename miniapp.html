<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЭИОС КемГУ - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header-info h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header-info p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .auth-container {
            display: none;
            max-width: 400px;
            margin: 40px auto;
        }

        .auth-container.active {
            display: block;
        }

        .auth-form {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 24px;
            border-radius: 16px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-subtitle {
            color: var(--tg-theme-hint-color, #999999);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            border-radius: 8px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #3390ec);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 16px;
            border-radius: 12px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .see-all {
            font-size: 14px;
            color: var(--tg-theme-link-color, #3390ec);
            text-decoration: none;
        }

        .grade-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .grade-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .subject-name {
            font-weight: 600;
            font-size: 16px;
        }

        .grade-value {
            font-size: 20px;
            font-weight: 700;
        }

        .grade-5 { color: #10b981; }
        .grade-4 { color: #3b82f6; }
        .grade-3 { color: #f59e0b; }
        .grade-2 { color: #ef4444; }

        .assignment-name {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 4px;
        }

        .grade-date {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .comment {
            margin-top: 12px;
            padding: 12px;
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 8px;
            font-size: 14px;
            border-left: 3px solid var(--tg-theme-link-color, #3390ec);
        }

        .comment-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <!-- Форма авторизации -->
    <div id="authContainer" class="auth-container active">
        <div class="auth-form">
            <h2 class="auth-title">Вход в ЭИОС</h2>
            <p class="auth-subtitle">Используйте свои учетные данные</p>
            
            <form id="authForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" placeholder="Ваш логин" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Ваш пароль" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
        </div>
    </div>

    <!-- Главная панель -->
    <div id="dashboard" class="dashboard">
        <div class="header">
            <div class="header-icon">🎓</div>
            <div class="header-info">
                <h1 id="studentName">Загрузка...</h1>
                <p id="studentGroup">Группа загружается...</p>
            </div>
        </div>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Средний балл</div>
                <div class="stat-value" id="avgGrade">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Всего оценок</div>
                <div class="stat-value" id="totalGrades">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Текущий семестр</div>
                <div class="stat-value" id="semester">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">До сессии</div>
                <div class="stat-value" id="daysToSession">-</div>
            </div>
        </div>

        <!-- Последние оценки -->
        <div class="section">
            <div class="section-header">
                <h2 class="section-title">Последние оценки</h2>
                <a href="#" class="see-all" onclick="showAllGrades(); return false;">Все оценки</a>
            </div>
            <div id="gradesList"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Применяем тему Telegram
        document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';
        document.body.style.color = tg.themeParams.text_color || '#000000';

        // Проверяем, авторизован ли пользователь
        let isAuthorized = localStorage.getItem('isAuthorized') === 'true';
        let studentData = null;

        if (isAuthorized) {
            studentData = JSON.parse(localStorage.getItem('studentData') || '{}');
            showDashboard();
        }

        // Обработка формы авторизации
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // В продакшене здесь должен быть реальный запрос к API
            // Пример:
            /*
            try {
                const response = await fetch('https://eios.kemsu.ru/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    studentData = data.student;
                    localStorage.setItem('isAuthorized', 'true');
                    localStorage.setItem('studentData', JSON.stringify(studentData));
                    
                    // Отправляем данные боту
                    tg.sendData(JSON.stringify({
                        action: 'auth',
                        student_id: studentData.id,
                        telegram_id: tg.initDataUnsafe.user.id
                    }));
                    
                    showDashboard();
                } else {
                    alert('Неверный логин или пароль');
                }
            } catch (error) {
                alert('Ошибка подключения к серверу');
            }
            */

            // Демо-режим
            studentData = {
                id: 12345,
                name: tg.initDataUnsafe.user?.first_name || 'Иван Иванов',
                group: 'ПИ-251',
                semester: 5,
                avgGrade: 4.5
            };

            localStorage.setItem('isAuthorized', 'true');
            localStorage.setItem('studentData', JSON.stringify(studentData));

            // Отправляем данные боту
            tg.sendData(JSON.stringify({
                action: 'auth',
                student_id: studentData.id,
                telegram_id: tg.initDataUnsafe.user?.id
            }));

            showDashboard();
        });

        function showDashboard() {
            document.getElementById('authContainer').classList.remove('active');
            document.getElementById('dashboard').classList.add('active');

            if (studentData) {
                document.getElementById('studentName').textContent = studentData.name;
                document.getElementById('studentGroup').textContent = `Группа ${studentData.group}`;
                document.getElementById('avgGrade').textContent = studentData.avgGrade || '4.5';
                document.getElementById('semester').textContent = studentData.semester || '5';
            }

            loadGrades();
            loadStats();
        }

        async function loadGrades() {
            const gradesList = document.getElementById('gradesList');
            
            // В продакшене здесь запрос к API
            // Демо-данные
            const grades = [
                {
                    subject: 'Высшая математика',
                    assignment: 'Контрольная работа №3',
                    grade: 5,
                    date: '25.01.2026',
                    comment: 'Отличная работа! Все задания выполнены верно.'
                },
                {
                    subject: 'Программирование',
                    assignment: 'Лабораторная работа №2',
                    grade: 5,
                    date: '23.01.2026',
                    comment: null
                },
                {
                    subject: 'Базы данных',
                    assignment: 'Домашнее задание №4',
                    grade: 4,
                    date: '22.01.2026',
                    comment: 'Хорошо, но есть небольшие замечания по оформлению.'
                },
                {
                    subject: 'Иностранный язык',
                    assignment: 'Эссе',
                    grade: 4,
                    date: '20.01.2026',
                    comment: null
                }
            ];

            gradesList.innerHTML = grades.map(grade => `
                <div class="grade-card">
                    <div class="grade-header">
                        <div>
                            <div class="subject-name">${grade.subject}</div>
                            <div class="assignment-name">${grade.assignment}</div>
                        </div>
                        <div class="grade-value grade-${grade.grade}">${grade.grade}</div>
                    </div>
                    <div class="grade-date">📅 ${grade.date}</div>
                    ${grade.comment ? `
                        <div class="comment">
                            <div class="comment-label">💬 Комментарий преподавателя:</div>
                            ${grade.comment}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function loadStats() {
            // Подсчет статистики
            document.getElementById('totalGrades').textContent = '24';
            
            // Дни до сессии
            const sessionDate = new Date('2026-06-01');
            const today = new Date();
            const daysToSession = Math.ceil((sessionDate - today) / (1000 * 60 * 60 * 24));
            document.getElementById('daysToSession').textContent = `${daysToSession} дн.`;
        }

        function showAllGrades() {
            // Можно открыть отдельную страницу или показать модальное окно
            tg.showAlert('Здесь будет список всех оценок за семестр');
        }

        // Настройка кнопок Telegram
        tg.MainButton.text = 'Обновить данные';
        tg.MainButton.onClick(() => {
            loadGrades();
            loadStats();
            tg.showPopup({
                title: 'Обновлено',
                message: 'Данные успешно обновлены'
            });
        });
        
        if (isAuthorized) {
            tg.MainButton.show();
        }
    </script>
</body>
</html>
